name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        run: gh release create ${{ github.ref_name }} --repo ${{ github.repository }} --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build (${{ matrix.target }})
    runs-on: macos-latest
    needs: [create-release]
    permissions:
      contents: write
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v6

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          cp target/${{ matrix.target }}/release/get-system-include-dirs \
             get-system-include-dirs-${{ matrix.target }}

      - name: Upload to GitHub Release
        run: gh release upload ${{ github.ref_name }} get-system-include-dirs-${{ matrix.target }} --repo ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ubuntu:
    name: Build (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-24.04
    needs: [create-release]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Add Rust target
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Rename binary
        run: |
          cp target/x86_64-unknown-linux-gnu/release/get-system-include-dirs \
             get-system-include-dirs-x86_64-unknown-linux-gnu

      - name: Upload to GitHub Release
        run: gh release upload ${{ github.ref_name }} get-system-include-dirs-x86_64-unknown-linux-gnu --repo ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build (x86_64-pc-windows-msvc)
    runs-on: windows-2025
    needs: [create-release]
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Add Rust target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Smoke test
        shell: pwsh
        run: |
          $output = & .\target\x86_64-pc-windows-msvc\release\get-system-include-dirs.exe
          if ($LASTEXITCODE -ne 0) { throw "Binary exited with code $LASTEXITCODE" }
          if (-not $output) { throw "No output produced" }
          Write-Host "Found include dirs:"
          $output | ForEach-Object { Write-Host "  $_" }

      - name: Rename binary
        run: |
          cp target/x86_64-pc-windows-msvc/release/get-system-include-dirs.exe \
             get-system-include-dirs-x86_64-pc-windows-msvc.exe

      - name: Upload to GitHub Release
        run: gh release upload ${{ github.ref_name }} get-system-include-dirs-x86_64-pc-windows-msvc.exe --repo ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
